<style>
/* =================================
   CREATIVELY, CHLOE K - ART GALLERY
   ================================= */

.ck-gallery {
  --ck-green: #38442e;
  --ck-cream: #ffe7c2;
  --ck-orange: #b8311c;
  --ck-paper: #fff9e9;
  --ck-grey: #a29691;

  width: 100%;
  font-family: inherit;
}

.ck-gallery-grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: clamp(12px, 2vw, 26px);
  align-items: start;
}

/* Individual photo cards */

.ck-gallery-card {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
  overflow: hidden;
  color: white;
  border-radius: 2px;
}

.ck-gallery-card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

/* Editorial arrangement */

.ck-gallery-card:nth-child(7n + 1) {
  grid-column: span 7;
  aspect-ratio: 5 / 4;
}

.ck-gallery-card:nth-child(7n + 2) {
  grid-column: span 5;
  aspect-ratio: 4 / 5;
}

.ck-gallery-card:nth-child(7n + 3) {
  grid-column: span 4;
  aspect-ratio: 4 / 5;
}

.ck-gallery-card:nth-child(7n + 4) {
  grid-column: span 4;
  aspect-ratio: 1 / 1;
}

.ck-gallery-card:nth-child(7n + 5) {
  grid-column: span 4;
  aspect-ratio: 4 / 5;
}

.ck-gallery-card:nth-child(7n + 6) {
  grid-column: span 6;
  aspect-ratio: 5 / 4;
}

.ck-gallery-card:nth-child(7n + 7) {
  grid-column: span 6;
  aspect-ratio: 5 / 4;
}

/* Hover overlay */

.ck-gallery-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: clamp(14px, 3vw, 28px);
  background: rgba(56, 68, 46, 0.78);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.ck-gallery-overlay strong {
  font-size: clamp(16px, 2vw, 24px);
  font-weight: 600;
}

.ck-gallery-overlay span {
  margin-top: 8px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ck-cream);
}

.ck-gallery-card:hover .ck-gallery-overlay,
.ck-gallery-card:focus-visible .ck-gallery-overlay {
  opacity: 1;
}

.ck-gallery-card:hover img {
  transform: scale(1.04);
}

.ck-gallery-card:focus-visible {
  outline: 3px solid var(--ck-orange);
  outline-offset: 4px;
}

/* Full detail popup */

.ck-gallery-dialog {
  width: min(900px, calc(100% - 32px));
  max-width: 900px;
  max-height: 90vh;
  padding: 0;
  border: none;
  background: var(--ck-paper);
  color: var(--ck-green);
  overflow: auto;
  box-shadow: 0 20px 80px rgba(0,0,0,0.3);
}

.ck-gallery-dialog::backdrop {
  background: rgba(25, 30, 22, 0.78);
  backdrop-filter: blur(4px);
}

.ck-gallery-detail {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  min-height: 400px;
}

.ck-gallery-detail-image {
  width: 100%;
  height: 100%;
  min-height: 400px;
  object-fit: cover;
}

.ck-gallery-detail-content {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(24px, 4vw, 48px);
}

.ck-gallery-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  border: 1px solid var(--ck-grey);
  border-radius: 50%;
  background: transparent;
  color: var(--ck-green);
  font-size: 23px;
  line-height: 1;
  cursor: pointer;
}

.ck-gallery-close:hover {
  background: var(--ck-green);
  color: var(--ck-cream);
}

.ck-gallery-detail h2 {
  margin: 20px 0 12px;
  color: var(--ck-green);
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.15;
}

.ck-gallery-detail p {
  margin: 0 0 18px;
  line-height: 1.7;
  font-size: 15px;
}

.ck-gallery-meta {
  margin-top: 10px;
  padding-top: 16px;
  border-top: 1px solid var(--ck-grey);
  font-size: 13px;
  line-height: 1.8;
}

.ck-gallery-category {
  color: var(--ck-orange);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* Mobile */

@media (max-width: 650px) {
  .ck-gallery-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .ck-gallery-card:nth-child(n) {
    grid-column: span 1;
    aspect-ratio: 4 / 5;
  }

  .ck-gallery-card:nth-child(4n + 1) {
    grid-column: span 2;
    aspect-ratio: 5 / 4;
  }

  .ck-gallery-overlay {
    padding: 12px;
  }

  .ck-gallery-overlay strong {
    font-size: 16px;
  }

  .ck-gallery-overlay span {
    font-size: 10px;
  }

  .ck-gallery-detail {
    grid-template-columns: 1fr;
  }

  .ck-gallery-detail-image {
    height: 300px;
    min-height: 0;
  }

  .ck-gallery-detail-content {
    padding: 24px;
  }

  .ck-gallery-dialog {
    max-height: 88vh;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ck-gallery-card img,
  .ck-gallery-overlay {
    transition: none;
  }
}
</style>

<div class="ck-gallery">
  <div class="ck-gallery-grid" id="ckGalleryGrid"></div>

  <dialog class="ck-gallery-dialog" id="ckGalleryDialog">

        class="ck-gallery-detail-image"

        </div>

  </dialog>
</div>

      year: "2026"
    }
  ];

  const grid = document.getElementById("ckGalleryGrid");
  const dialog = document.getElementById("ckGalleryDialog");
  const closeButton = document.getElementById("ckGalleryClose");

  const detailImage = document.getElementById("ckDetailImage");
  const detailCategory = document.getElementById("ckDetailCategory");
  const detailTitle = document.getElementById("ckDetailTitle");
  const detailDescription = document.getElementById("ckDetailDescription");
  const detailMaterials = document.getElementById("ckDetailMaterials");
  const detailYear = document.getElementById("ckDetailYear");

  if (!grid || !dialog) return;

  function openArtwork(artwork) {
    detailImage.src = artwork.image;
    detailImage.alt = artwork.alt;
    detailCategory.textContent = artwork.category;
    detailTitle.textContent = artwork.title;
    detailDescription.textContent = artwork.description;
    detailMaterials.textContent = "Materials: " + artwork.materials;
    detailYear.textContent = "Year: " + artwork.year;

    dialog.showModal();
  }

  artworks.forEach((artwork) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "ck-gallery-card";
    card.setAttribute("aria-label", "View details for " + artwork.title);

    const image = document.createElement("img");
    image.src = artwork.image;
    image.alt = artwork.alt;
    image.loading = "lazy";
    image.decoding = "async";

    const overlay = document.createElement("div");
    overlay.className = "ck-gallery-overlay";

    const title = document.createElement("strong");
    title.textContent = artwork.title;

    const prompt = document.createElement("span");
    prompt.textContent = "View details →";

    overlay.append(title, prompt);
    card.append(image, overlay);

    card.addEventListener("click", () => openArtwork(artwork));

    grid.appendChild(card);
  });

  closeButton.addEventListener("click", () => dialog.close());

  dialog.addEventListener("click", (event) => {
    if (event.target === dialog) dialog.close();
  });
})();
